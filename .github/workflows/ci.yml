name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    name: Focused Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install development checks
        run: uv sync --project backend --locked --only-dev
      - name: Check existing runtime and database safety interfaces
        run: uv run --project backend --locked --no-sync python -m ruff check .

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: langconfig
          POSTGRES_PASSWORD: langconfig_dev
          POSTGRES_DB: langconfig
        ports:
          # backend/db/database.py and backend/conftest.py default to localhost:5432
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U langconfig"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://langconfig:langconfig_dev@localhost:5432/langconfig_test
      TEST_DATABASE_URL: postgresql+asyncpg://langconfig:langconfig_dev@localhost:5432/langconfig_test
      LANGCONFIG_TEST_EMBEDDINGS: '1'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        run: |
          uv sync --project backend --locked
          uv run --project backend --locked python -m pip check

      - name: Create test database
        # backend/conftest.py runs Alembic against langconfig_test; the service
        # container only creates the primary langconfig database.
        run: |
          PGPASSWORD=langconfig_dev psql -h localhost -p 5432 -U langconfig -d langconfig \
            -c "CREATE DATABASE langconfig_test;"

      - name: Run pytest
        working-directory: backend
        # test_playwright_tools.py is a manual smoke script that needs installed
        # Playwright browsers (python -m playwright install chromium); excluded in CI.
        run: |
          uv run --locked --no-sync python -m pytest -q \
            --ignore=tests/test_playwright_tools.py

  dependency-audit:
    name: Python dependency security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Test advisory policy
        run: uv run --no-project --with pytest==9.1.1 python -m pytest --noconftest backend/tests/test_python_advisory_policy.py -q

      - name: Audit fully resolved backend dependencies
        run: |
          uv run --no-project --with pip-audit==2.10.1 python scripts/check-python-advisories.py --report python-advisories.json

      - name: Retain complete advisory report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-advisories
          path: python-advisories.json
          if-no-files-found: error

  frontend-build:
    name: Frontend lint, types, build, and Hermes tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit runtime and development npm dependencies
        run: npm audit --audit-level=low --json > npm-advisories.json

      - name: Retain complete npm advisory report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-advisories
          path: npm-advisories.json
          if-no-files-found: error

      - name: Lint scoped JavaScript and check formatting
        run: |
          npm run lint
          npm run format:check

      # Includes application types and static-import contracts; no Rust toolchain needed.
      - name: Build frontend
        run: npm run build

      - name: Install Chromium for Hermes interaction regressions
        run: npx playwright install --with-deps chromium

      - name: Check Hermes approval and stream lifecycle
        run: npm run test:hermes

      - name: Retain failed Hermes browser traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-browser-results
          path: test-results/hermes
          if-no-files-found: ignore
